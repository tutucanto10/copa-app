<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <style>
      .bd { fill: none; stroke: #f5d000; stroke-width: 1.3; opacity: 0.17; }
      .st { fill: #f5d000; opacity: 0.13; font-family: Arial, sans-serif; }
      .nm { fill: #f5d000; opacity: 0.10; font-family: Arial, sans-serif; font-weight: 800; letter-spacing: 2.5px; }
    </style>
  </defs>

  <!-- Bandeira 1 — topo esquerda -->
  <g transform="translate(10, 14)">
    <rect class="bd" x="0" y="0" width="82" height="54" rx="2"/>
    <polygon class="bd" points="41,5 79,27 41,49 3,27"/>
    <circle class="bd" cx="41" cy="27" r="15"/>
  </g>

  <!-- 5 estrelas — topo direita -->
  <text class="st" x="162" y="34" font-size="13">★  ★  ★  ★  ★</text>

  <!-- Nome: PELÉ -->
  <text class="nm" x="14" y="87" font-size="9" transform="rotate(-12, 14, 87)">PELÉ</text>

  <!-- Escudo CBF — meio esquerda -->
  <g transform="translate(12, 106)">
    <path class="bd" d="M34,0 C53,5 67,16 67,32 L67,56 C67,78 34,92 34,92 C34,92 1,78 1,56 L1,32 C1,16 15,5 34,0 Z"/>
    <text x="34" y="42" text-anchor="middle" font-size="8" font-family="Arial" font-weight="800" fill="#f5d000" opacity="0.15" letter-spacing="1.5">CBF</text>
    <text x="34" y="60" text-anchor="middle" font-size="9" font-family="Arial" fill="#f5d000" opacity="0.12">★ ★ ★ ★ ★</text>
  </g>

  <!-- Nomes à direita do escudo -->
  <text class="nm" x="108" y="122" font-size="8" transform="rotate(-12, 108, 122)">RONALDO</text>
  <text class="nm" x="240" y="130" font-size="8" transform="rotate(-12, 240, 130)">ZICO</text>

  <text class="nm" x="104" y="160" font-size="7.5" transform="rotate(-12, 104, 160)">RONALDINHO</text>
  <text class="nm" x="210" y="168" font-size="8" transform="rotate(-12, 210, 168)">ROMÁRIO</text>

  <text class="nm" x="104" y="200" font-size="8" transform="rotate(-12, 104, 200)">GARRINCHA</text>

  <!-- Bandeira 2 — meio direita -->
  <g transform="translate(192, 206)">
    <rect class="bd" x="0" y="0" width="82" height="54" rx="2"/>
    <polygon class="bd" points="41,5 79,27 41,49 3,27"/>
    <circle class="bd" cx="41" cy="27" r="15"/>
  </g>

  <!-- 5 estrelas — base esquerda -->
  <text class="st" x="10" y="258" font-size="11">★  ★  ★  ★  ★</text>

  <!-- Nomes base -->
  <text class="nm" x="104" y="238" font-size="8" transform="rotate(-12, 104, 238)">NEYMAR</text>
  <text class="nm" x="14" y="285" font-size="8" transform="rotate(-12, 14, 285)">CAFU</text>
  <text class="nm" x="142" y="280" font-size="7.5" transform="rotate(-12, 142, 280)">VINI JR</text>

  <!-- Escudo CBF pequeno — base direita -->
  <g transform="translate(238, 258) scale(0.62)">
    <path class="bd" d="M34,0 C53,5 67,16 67,32 L67,56 C67,78 34,92 34,92 C34,92 1,78 1,56 L1,32 C1,16 15,5 34,0 Z"/>
    <text x="34" y="42" text-anchor="middle" font-size="8" font-family="Arial" font-weight="800" fill="#f5d000" opacity="0.15" letter-spacing="1.5">CBF</text>
  </g>
</svg>
